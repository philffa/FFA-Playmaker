<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FFA Playmaker — Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* [KEEP YOUR EXISTING CSS HERE - I am omitting it for brevity, 
           but ensure you have the .page and .nav-tab styles from your previous code] */
        
        .page { display: none; flex: 1; overflow-y: auto; padding: 28px 32px; }
        .page.active { display: flex; flex-direction: column; }
        
        #admin-history-log {
            background: #0f1a0f;
            border: 1px solid #2a3d2a;
            border-radius: 12px;
            padding: 16px;
            margin-top: 20px;
            max-height: 400px;
            overflow-y: auto;
            font-family: monospace;
        }

        .log-entry {
            padding: 8px 0;
            border-bottom: 1px solid #2a3d2a;
            font-size: 13px;
        }
    </style>
</head>
<body>

<div class="toast" id="toast"></div>

<nav>
    <div class="nav-logo">FFA Playmaker</div>
    <div class="nav-tabs">
        <button class="nav-tab active" onclick="showPage('designer')" id="tab-designer">✏️ Designer</button>
        <button class="nav-tab" onclick="showPage('plays')" id="tab-plays">📋 My Plays</button>
        <button class="nav-tab" onclick="showPage('team')" id="tab-team">🏟️ Team Hub</button>
        <button class="nav-tab" onclick="showPage('admin')" id="tab-admin" style="display:none; color: #b8ff47;">🛡️ Admin</button>
    </div>
    <div class="nav-user">
        <span>Signed in as <strong id="user-name-display">...</strong></span>
        <button class="btn-signout" onclick="doSignOut()">Sign out</button>
    </div>
</nav>

<div class="page active" id="page-designer">
    </div>

<div class="page" id="page-plays">
    <div class="page-header">
        <h1>My Plays</h1>
    </div>
    <div class="plays-grid" id="plays-grid"></div>
</div>

<div class="page" id="page-team">
    <div class="team-panel">
        <h2>Create a Team</h2>
        <input type="text" id="new-team-name" placeholder="Team Name">
        <button class="btn-action" onclick="createTeam()">Create Team</button>
    </div>
    <div id="teams-container"></div>
</div>

<div class="page" id="page-admin">
    <div class="page-header">
        <h1 style="color: #b8ff47;">Admin Control Panel</h1>
        <button class="btn-action" onclick="refreshAdminData()">Refresh Logs</button>
    </div>
    <div id="admin-history-log">
        <p style="color: #7a8e72;">Click refresh to load activity logs...</p>
    </div>
</div>
