<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FFA Playmaker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ── Reset & Variables ──────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --turf:       #1a2e1a;
  --turf2:      #213821;
  --turf3:      #172617;
  --lime:       #b8ff47;
  --lime2:      #96d93a;
  --white:      #f2f5ee;
  --muted:      #7a8e72;
  --panel:      #0f1a0f;
  --border:     #2a3d2a;
  --error:      #ff5e5e;
  --warning:    #ffb347;
  --info:       #47d4ff;
  --radius:     10px;
  --nav-h:      58px;
}
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--turf);
  color: var(--white);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── Nav ────────────────────────────────────────────────────────────────── */
nav {
  height: var(--nav-h);
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 20px;
  gap: 0;
  flex-shrink: 0;
  z-index: 100;
}
.nav-logo {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 26px;
  color: var(--lime);
  letter-spacing: 1.5px;
  margin-right: 24px;
  flex-shrink: 0;
}
.nav-tabs { display: flex; gap: 2px; flex: 1; }
.nav-tab {
  padding: 7px 16px;
  border: none;
  background: transparent;
  color: var(--muted);
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  font-weight: 500;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.15s;
  display: flex; align-items: center; gap: 6px;
}
.nav-tab:hover { background: var(--turf2); color: var(--white); }
.nav-tab.active { background: var(--lime); color: var(--panel); font-weight: 700; }
.nav-user { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
.nav-user strong { color: var(--white); }
.btn-signout { padding: 5px 12px; border: 1px solid var(--border); background: transparent; border-radius: 7px; color: var(--muted); font-size: 12px; cursor: pointer; }

/* ── Pages ──────────────────────────────────────────────────────────────── */
.page { display: none; flex: 1; overflow: hidden; }
.page.active { display: flex; }

/* ── Admin Specific Styles ── */
#admin-history-log {
  background: var(--turf3);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px;
  margin-top: 15px;
  max-height: 400px;
  overflow-y: auto;
}
.log-entry { padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 12px; }

/* [REST OF YOUR DESIGNER CSS REMAINS THE SAME] */
#page-designer { flex-direction: row; }
.designer-sidebar { width: 240px; flex-shrink: 0; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow-y: auto; padding: 16px; gap: 16px; }
.sidebar-section h3 { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 8px; }
.designer-canvas-wrap { flex: 1; display: flex; align-items: center; justify-content: center; background: #e8e8e8; overflow: hidden; position: relative; }
canvas#field { display: block; cursor: crosshair; touch-action: none; }
.btn-sidebar { width: 100%; padding: 9px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--turf2); color: var(--white); font-weight: 600; cursor: pointer; text-align: center; margin-bottom: 5px; }
.btn-sidebar.primary { background: var(--lime); color: var(--panel); border-color: var(--lime); }
.toast { position: fixed; bottom: 24px; right: 24px; background: var(--panel); border: 1px solid var(--lime); border-radius: 10px; padding: 12px 18px; font-size: 14px; color: var(--white); z-index: 9999; opacity: 0; transition: 0.2s; pointer-events: none; }
.toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="toast" id="toast"></div>

<nav>
  <div class="nav-logo">FFA Playmaker</div>
  <div class="nav-tabs">
    <button class="nav-tab active" onclick="showPage('designer')" id="tab-designer">✏️ Designer</button>
    <button class="nav-tab" onclick="showPage('plays')" id="tab-plays">📋 My Plays</button>
    <button class="nav-tab" onclick="showPage('team')" id="tab-team">🏟️ Team Hub</button>
    <button class="nav-tab" onclick="showPage('admin')" id="tab-admin" style="display:none; color: var(--warning);">🛡️ Admin</button>
  </div>
  <div class="nav-user">
    <span>Signed in as <strong id="user-name-display">…</strong></span>
    <button class="btn-signout" onclick="doSignOut()">Sign
