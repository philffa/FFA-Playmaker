<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flag Football Australia — Play Designer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --turf:    #1a2e1a;
    --turf2:   #213821;
    --lime:    #b8ff47;
    --lime2:   #96d93a;
    --white:   #f2f5ee;
    --muted:   #8a9e82;
    --panel:   #0f1a0f;
    --border:  #2e422e;
    --error:   #ff5e5e;
    --radius:  10px;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--turf);
    color: var(--white);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  /* Field line background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      repeating-linear-gradient(
        0deg,
        transparent,
        transparent 59px,
        rgba(255,255,255,0.04) 59px,
        rgba(255,255,255,0.04) 60px
      ),
      repeating-linear-gradient(
        90deg,
        transparent,
        transparent 59px,
        rgba(255,255,255,0.025) 59px,
        rgba(255,255,255,0.025) 60px
      );
    pointer-events: none;
  }

  /* LOS stripe */
  body::after {
    content: '';
    position: fixed;
    left: 0; right: 0;
    top: 50%;
    height: 3px;
    background: rgba(184,255,71,0.15);
    pointer-events: none;
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    width: 420px;
    padding: 44px 40px 40px;
    position: relative;
    z-index: 1;
    box-shadow: 0 32px 80px rgba(0,0,0,0.6);
  }

  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 38px;
    letter-spacing: 2px;
    color: var(--lime);
    line-height: 1;
    margin-bottom: 4px;
  }

  .tagline {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 36px;
    letter-spacing: 0.5px;
  }

  .tabs {
    display: flex;
    gap: 4px;
    background: var(--turf2);
    border-radius: var(--radius);
    padding: 4px;
    margin-bottom: 28px;
  }

  .tab {
    flex: 1;
    padding: 9px;
    border: none;
    background: transparent;
    color: var(--muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 500;
    border-radius: 7px;
    cursor: pointer;
    transition: all 0.18s;
  }

  .tab.active {
    background: var(--lime);
    color: var(--panel);
  }

  .form-group {
    margin-bottom: 16px;
  }

  label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: 0.8px;
    text-transform: uppercase;
    margin-bottom: 7px;
  }

  input {
    width: 100%;
    background: var(--turf2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--white);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    padding: 12px 14px;
    outline: none;
    transition: border-color 0.15s;
  }

  input:focus {
    border-color: var(--lime);
  }

  input::placeholder { color: var(--muted); }

  .btn-primary {
    width: 100%;
    margin-top: 8px;
    padding: 14px;
    background: var(--lime);
    border: none;
    border-radius: var(--radius);
    color: var(--panel);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.3px;
    transition: background 0.15s, transform 0.1s;
  }

  .btn-primary:hover  { background: var(--lime2); }
  .btn-primary:active { transform: scale(0.98); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

  .error-msg {
    color: var(--error);
    font-size: 13px;
    margin-top: 12px;
    text-align: center;
    min-height: 18px;
  }

  .panel { display: none; }
  .panel.active { display: block; }

  .field-badge {
    position: absolute;
    top: -1px; right: 28px;
    background: var(--lime);
    color: var(--panel);
    font-family: 'Bebas Neue', sans-serif;
    font-size: 11px;
    letter-spacing: 1.5px;
    padding: 3px 10px;
    border-radius: 0 0 8px 8px;
  }
</style>
</head>
<body>

<div class="card">
  <div class="field-badge">5v5 FLAG</div>
  <div class="logo">Flag Football Australia</div>
  <div class="tagline">Play Designer &amp; team playbook</div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('login')">Sign In</button>
    <button class="tab" onclick="switchTab('signup')">Create Account</button>
  </div>

  <!-- Login -->
  <div id="panel-login" class="panel active">
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="login-email" placeholder="you@example.com" autocomplete="email">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn-primary" id="login-btn" onclick="doLogin()">Sign In</button>
    <div class="error-msg" id="login-error"></div>
  </div>

  <!-- Signup -->
  <div id="panel-signup" class="panel">
    <div class="form-group">
      <label>Display Name</label>
      <input type="text" id="signup-name" placeholder="Your name">
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="signup-email" placeholder="you@example.com" autocomplete="email">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="signup-password" placeholder="Min. 6 characters" autocomplete="new-password">
    </div>
    <button class="btn-primary" id="signup-btn" onclick="doSignup()">Create Account</button>
    <div class="error-msg" id="signup-error"></div>
  </div>
</div>

<!-- Firebase SDKs -->
<script src="firebase-config.js"></script>
<script type="module">
  import { initializeApp }                          from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword,
           createUserWithEmailAndPassword,
           updateProfile, onAuthStateChanged }      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, doc, setDoc, serverTimestamp }
                                                    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const app  = initializeApp(FIREBASE_CONFIG);
  const auth = getAuth(app);
  const db   = getFirestore(app);

  // If already logged in, skip to app
  onAuthStateChanged(auth, user => {
    if (user) window.location.href = 'app.html';
  });

  // ── Tab switching ─────────────────────────────────────────────────────────
  window.switchTab = (tab) => {
    document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', (i===0) === (tab==='login')));
    document.getElementById('panel-login').classList.toggle('active', tab==='login');
    document.getElementById('panel-signup').classList.toggle('active', tab==='signup');
    document.getElementById('login-error').textContent = '';
    document.getElementById('signup-error').textContent = '';
  };

  // ── Login ─────────────────────────────────────────────────────────────────
  window.doLogin = async () => {
    const email    = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    const errEl    = document.getElementById('login-error');
    const btn      = document.getElementById('login-btn');
    errEl.textContent = '';
    btn.disabled = true; btn.textContent = 'Signing in…';
    try {
      await signInWithEmailAndPassword(auth, email, password);
      // onAuthStateChanged will redirect
    } catch(e) {
      errEl.textContent = friendlyError(e.code);
      btn.disabled = false; btn.textContent = 'Sign In';
    }
  };

  // ── Signup ────────────────────────────────────────────────────────────────
  window.doSignup = async () => {
    const name     = document.getElementById('signup-name').value.trim();
    const email    = document.getElementById('signup-email').value.trim();
    const password = document.getElementById('signup-password').value;
    const errEl    = document.getElementById('signup-error');
    const btn      = document.getElementById('signup-btn');
    if (!name) { errEl.textContent = 'Please enter a display name.'; return; }
    errEl.textContent = '';
    btn.disabled = true; btn.textContent = 'Creating account…';
    try {
      const cred = await createUserWithEmailAndPassword(auth, email, password);
      await updateProfile(cred.user, { displayName: name });
      await setDoc(doc(db, 'users', cred.user.uid), {
        displayName: name,
        email:       email,
        teamId:      null,
        createdAt:   serverTimestamp()
      });
      // onAuthStateChanged redirects
    } catch(e) {
      errEl.textContent = friendlyError(e.code);
      btn.disabled = false; btn.textContent = 'Create Account';
    }
  };

  // ── Allow Enter key ───────────────────────────────────────────────────────
  document.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    if (document.getElementById('panel-login').classList.contains('active'))  window.doLogin();
    else window.doSignup();
  });

  function friendlyError(code) {
    const map = {
      'auth/invalid-email':          'Invalid email address.',
      'auth/user-not-found':         'No account found with that email.',
      'auth/wrong-password':         'Incorrect password.',
      'auth/email-already-in-use':   'An account with that email already exists.',
      'auth/weak-password':          'Password must be at least 6 characters.',
      'auth/too-many-requests':      'Too many attempts. Please try again later.',
      'auth/invalid-credential':     'Invalid email or password.',
    };
    return map[code] || 'Something went wrong. Please try again.';
  }
</script>
</body>
</html>
